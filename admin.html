<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - HumbaCenter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #004d2d;
            --primary-dark: #003d1f;
            --primary-light: #006d3f;
            --secondary-color: #ffc107;
            --text-primary: #1a1a1a;
            --text-secondary: #666;
            --border-color: #e0e0e0;
            --background-light: #f5f5f5;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--background-light);
            color: var(--text-primary);
        }

        .dashboard-shell {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: linear-gradient(160deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .sidebar::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, rgba(255,193,7,0.16), transparent 35%);
            pointer-events: none;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            padding: 4px 2px;
        }

        .brand-mark {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--secondary-color), #ffd96b);
            color: var(--primary-color);
            display: grid;
            place-items: center;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 8px 18px rgba(0,0,0,0.18);
        }

        .brand h3 {
            font-size: 18px;
            font-family: 'Poppins', sans-serif;
            letter-spacing: -0.2px;
        }

        .brand p {
            font-size: 12px;
            color: rgba(255,255,255,0.78);
            margin-top: 2px;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            z-index: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255,255,255,0.92);
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 12px;
            transition: all 0.25s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item i {
            width: 18px;
            text-align: center;
            color: rgba(255,255,255,0.9);
        }

        .nav-item:hover,
        .nav-item.active {
            background: rgba(255, 193, 7, 0.16);
            color: var(--secondary-color);
            transform: translateX(3px);
            box-shadow: inset 0 0 0 1px rgba(255,193,7,0.18);
        }

        .nav-item:hover i,
        .nav-item.active i {
            color: var(--secondary-color);
        }

        .sidebar-footer {
            margin-top: 24px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(6px);
            position: relative;
            z-index: 1;
        }

        .sidebar-footer p {
            font-size: 12px;
            color: rgba(255,255,255,0.78);
            margin-bottom: 10px;
        }

        .main-panel {
            background: var(--background-light);
        }

        .topbar {
            background: white;
            border-bottom: 1px solid var(--border-color);
            padding: 20px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .topbar h1 {
            font-size: 24px;
            color: var(--primary-color);
            font-family: 'Poppins', sans-serif;
        }

        .eyebrow {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--secondary-color);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--background-light);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 8px 12px;
        }

        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 13px;
            width: 180px;
        }

        .user-chip {
            background: var(--primary-color);
            color: white;
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px 28px 32px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: var(--shadow-sm);
            border-left: 4px solid var(--primary-color);
        }

        .stat-card h3 {
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 20px;
            align-items: start;
        }

        .section {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
        }

        .section h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 20px;
            font-family: 'Poppins', sans-serif;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            background: #fcfcfc;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 110px;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,77,45,0.2);
        }

        .btn-secondary {
            background-color: var(--secondary-color);
            color: var(--primary-color);
        }

        .btn-secondary:hover {
            background-color: #ffb300;
        }

        .btn-danger {
            background-color: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background-color: #c0392b;
        }

        .alert {
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border-left: 4px solid #e74c3c;
        }

        .alert-info {
            background-color: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #17a2b8;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .table th {
            background-color: #f7f7f7;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
        }

        .table td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
        }

        .table tr:hover {
            background-color: #fcfcfc;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 992px) {
            .dashboard-shell {
                grid-template-columns: 1fr;
            }

            .sidebar {
                padding: 18px;
            }

            .sidebar-nav {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .topbar-actions {
                width: 100%;
                flex-wrap: wrap;
            }

            .search-box input {
                width: 100%;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-shell">
        <aside class="sidebar">
            <div>
                <div class="brand">
                    <div class="brand-mark">HC</div>
                    <div>
                        <h3>HumbaCenter</h3>
                        <p>Admin Panel</p>
                    </div>
                </div>

                <nav class="sidebar-nav">
                    <a href="admin.html" class="nav-item active"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a>
                    <a href="index.html" class="nav-item"><i class="fas fa-newspaper"></i><span>Layanan</span></a>
                    <a href="profile.html" class="nav-item"><i class="fas fa-building"></i><span>Profil</span></a>
                    <a href="cari.html" class="nav-item"><i class="fas fa-search"></i><span>Cari</span></a>
                    <a href="filter.html" class="nav-item"><i class="fas fa-filter"></i><span>Filter</span></a>
                </nav>
            </div>

            <div class="sidebar-footer">
                <p>Versi 1.0 • Portal editorial</p>
                <button class="btn btn-secondary"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </aside>

        <main class="main-panel">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Panel Admin</p>
                    <h1>Dashboard HumbaCenter</h1>
                </div>
                <div class="topbar-actions">
                    <div class="search-box">
                        <i class="fas fa-search" style="color:#999; margin-right:8px;"></i>
                        <input type="text" placeholder="Cari berita..."></input>
                    </div>
                    <div class="user-chip">Redaktur</div>
                </div>
            </header>

            <div class="container">
                <div class="stats" id="statsContainer">
                    <div class="stat-card">
                        <h3>Total Berita</h3>
                        <div class="number" id="totalNews">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>Berita Terbit</h3>
                        <div class="number" id="publishedNews">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>Draft</h3>
                        <div class="number" id="draftNews">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>Total Views</h3>
                        <div class="number" id="totalViews">0</div>
                    </div>
                </div>

                <div id="alertContainer"></div>

                <div class="content-grid">
                    <section class="section">
                        <h2><i class="fas fa-plus-circle"></i> Buat Berita Baru</h2>
                        <form id="newsForm">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="title">Judul Berita *</label>
                                    <input type="text" id="title" name="title" required placeholder="Masukkan judul berita">
                                </div>
                                <div class="form-group">
                                    <label for="category">Kategori *</label>
                                    <select id="category" name="category" required>
                                        <option value="">-- Pilih Kategori --</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="description">Deskripsi Singkat</label>
                                    <input type="text" id="description" name="description" placeholder="Deskripsi untuk preview">
                                </div>
                                <div class="form-group">
                                    <label for="image">URL Gambar</label>
                                    <input type="url" id="image" name="image" placeholder="https://example.com/image.jpg">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="content">Konten Berita *</label>
                                <textarea id="content" name="content" required placeholder="Tulis konten berita di sini..."></textarea>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="status">Status</label>
                                    <select id="status" name="status">
                                        <option value="draft">Draft</option>
                                        <option value="published" selected>Published</option>
                                        <option value="archived">Archived</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="tags">Tags (pisahkan dengan koma)</label>
                                    <input type="text" id="tags" name="tags" placeholder="tag1, tag2, tag3">
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>
                                        <input type="checkbox" id="featured" name="featured"> Featured (Tampil di sebelah kiri)
                                    </label>
                                </div>
                                <div class="form-group">
                                    <label>
                                        <input type="checkbox" id="trending" name="trending"> Trending (Tampil di sidebar)
                                    </label>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Publish Berita
                            </button>
                            <button type="reset" class="btn btn-secondary">
                                <i class="fas fa-redo"></i> Reset
                            </button>
                        </form>
                    </section>

                    <section class="section">
                        <h2><i class="fas fa-list"></i> Daftar Berita Terbaru</h2>
                        <div id="newsList" class="loading">
                            <span class="spinner"></span> Loading...
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script src="api.js"></script>
    <script>
        // ==================== INITIALIZATION ====================
        
        document.addEventListener('DOMContentLoaded', async () => {
            // Load categories
            await loadCategories();
            // Load statistics
            await loadStatistics();
            // Load news list
            await loadNewsList();
            // Setup form handler
            document.getElementById('newsForm').addEventListener('submit', handleNewsSubmit);
        });

        // ==================== LOAD CATEGORIES ====================
        
        async function loadCategories() {
            try {
                const categories = await fetchCategories();
                const categorySelect = document.getElementById('category');
                
                categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat._id;
                    option.textContent = cat.name;
                    categorySelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading categories:', error);
                showAlert('Gagal memuat kategori', 'error');
            }
        }

        // ==================== LOAD STATISTICS ====================
        
        async function loadStatistics() {
            try {
                const stats = await getNewsStatistics();
                if (stats) {
                    document.getElementById('totalNews').textContent = stats.totalNews || 0;
                    document.getElementById('publishedNews').textContent = stats.publishedNews || 0;
                    document.getElementById('draftNews').textContent = stats.draftNews || 0;
                    document.getElementById('totalViews').textContent = stats.totalViews || 0;
                }
            } catch (error) {
                console.error('Error loading statistics:', error);
            }
        }

        // ==================== LOAD NEWS LIST ====================
        
        async function loadNewsList() {
            try {
                const { articles, pagination } = await fetchNews({ 
                    limit: 10, 
                    sort: '-updatedAt',
                    adminAccess: true,
                    status: undefined
                });
                
                const newsList = document.getElementById('newsList');
                
                if (articles.length === 0) {
                    newsList.innerHTML = '<p style="text-align: center; color: #999;">Belum ada berita</p>';
                    return;
                }
                
                let html = `
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Judul</th>
                                <th>Kategori</th>
                                <th>Status</th>
                                <th>Views</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                articles.forEach(article => {
                    const statusColor = article.status === 'published' ? '#28a745' : '#ffc107';
                    html += `
                        <tr>
                            <td>
                                <strong>${article.title}</strong>
                                <br>
                                <small style="color: #999;">${formatDate(article.createdAt)}</small>
                            </td>
                            <td>${article.category?.name || '-'}</td>
                            <td><span style="background: ${statusColor}; color: white; padding: 4px 8px; border-radius: 3px; font-size: 12px; font-weight: 600;">${article.status}</span></td>
                            <td>${article.viewCount}</td>
                            <td>
                                <div class="action-buttons">
                                    <button class="btn btn-small btn-secondary" onclick="editNews('${article._id}')">
                                        <i class="fas fa-edit"></i> Edit
                                    </button>
                                    <button class="btn btn-small btn-danger" onclick="deleteNewsItem('${article._id}', '${article.title}')">
                                        <i class="fas fa-trash"></i> Hapus
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
                
                html += `
                        </tbody>
                    </table>
                `;
                
                newsList.innerHTML = html;
            } catch (error) {
                console.error('Error loading news:', error);
                document.getElementById('newsList').innerHTML = '<p style="color: #e74c3c;">Gagal memuat berita</p>';
            }
        }

        // ==================== FORM HANDLERS ====================
        
        async function handleNewsSubmit(e) {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const description = document.getElementById('description').value;
            const category = document.getElementById('category').value;
            const image = document.getElementById('image').value;
            const status = document.getElementById('status').value;
            const featured = document.getElementById('featured').checked;
            const trending = document.getElementById('trending').checked;
            const tagsInput = document.getElementById('tags').value;
            
            const tags = tagsInput.split(',').map(tag => tag.trim()).filter(tag => tag);
            
            if (!title || !content || !category) {
                showAlert('Judul, konten, dan kategori harus diisi!', 'error');
                return;
            }
            
            try {
                const newsData = {
                    title,
                    content,
                    description,
                    category,
                    image: image || undefined,
                    status,
                    featured,
                    trending,
                    tags,
                    author: {
                        name: 'Redaktur',
                        email: 'redaktur@kemenag.go.id'
                    }
                };
                
                const result = await createNews(newsData);
                
                showAlert('✅ Berita berhasil dipublikasikan!', 'success');
                document.getElementById('newsForm').reset();
                
                // Reload news list and stats
                setTimeout(() => {
                    loadNewsList();
                    loadStatistics();
                }, 1000);
            } catch (error) {
                console.error('Error creating news:', error);
                showAlert('❌ Gagal mempublikasikan berita: ' + error.message, 'error');
            }
        }

        // ==================== ACTION HANDLERS ====================
        
        function editNews(id) {
            showAlert('Fitur edit sedang dalam pengembangan', 'info');
            console.log('Edit news:', id);
        }

        async function deleteNewsItem(id, title) {
            if (!confirm(`Apakah Anda yakin ingin menghapus berita "${title}"?`)) {
                return;
            }
            
            try {
                await deleteNews(id);
                showAlert('✅ Berita berhasil dihapus!', 'success');
                
                setTimeout(() => {
                    loadNewsList();
                    loadStatistics();
                }, 1000);
            } catch (error) {
                console.error('Error deleting news:', error);
                showAlert('❌ Gagal menghapus berita', 'error');
            }
        }

        // ==================== UTILITY FUNCTIONS ====================
        
        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = message;
            
            alertContainer.appendChild(alertDiv);
            
            // Auto remove after 5 seconds
            setTimeout(() => {
                alertDiv.remove();
            }, 5000);
        }
    </script>
</body>
</html>
